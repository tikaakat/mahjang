name: Mahjong League Season

concurrency:
  group: mahjong-league
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "何期（シーズン）分進めるか"
        required: false
        default: "1"
      sections_scale:
        description: "リーグの節数の倍率（1.0=標準、0.5=半分）"
        required: false
        default: "1.0"
      deploy_only:
        description: "シーズンを進めず、Xserverへの転送とDB取り込みだけを行う"
        type: boolean
        required: false
        default: false
      restore_kifu_run_id:
        description: "（転送のみのとき）牌譜のバックアップ（kifu-backup）を取り出す実行のID。空欄なら使わない"
        required: false
        default: ""
      deploy_attempt:
        description: "（自動の再実行用）何回目の転送のやり直しか"
        required: false
        default: "0"
  # 定期実行：毎日 朝6時・昼12時・夜18時ごろ（日本時間）に1季ずつ進める。時刻はUTCで書く。
  # GitHub の定期実行は、毎時0分ちょうどに集中して遅れたり抜けたりするため、17分にずらしている
  schedule:
    - cron: "17 21 * * *"   # 日本時間 6:17
    - cron: "17 3 * * *"    # 日本時間 12:17
    - cron: "17 9 * * *"    # 日本時間 18:17

permissions:
  contents: write
  actions: write   # 転送に失敗したとき、別の実行環境で転送をやり直す実行を自動で起こすため

jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Rule tests
        run: python -m unittest discover -s tests -v

      - name: Restore kifu from an earlier run
        if: ${{ github.event.inputs.restore_kifu_run_id != '' }}
        continue-on-error: true   # バックアップが無くても（牌譜が無い実行だった場合）、転送は続ける
        uses: actions/download-artifact@v4
        with:
          name: kifu-backup
          run-id: ${{ github.event.inputs.restore_kifu_run_id }}
          github-token: ${{ github.token }}
          path: data/kifu

      - name: Run seasons (push after each season)
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          # サイト（web/・server/・data/）の設置先。末尾は / で終える。例: /home/xxx/lab.spia-net.com/public_html/mahjong/
          XSERVER_TARGET_DIR: ${{ secrets.MAHJONG_XSERVER_TARGET_DIR }}
        run: |
          git config user.name "mahjong-league-bot"
          git config user.email "actions@users.noreply.github.com"

          DEPLOY=0
          if [ -n "$XSERVER_HOST" ] && [ -n "$XSERVER_TARGET_DIR" ]; then
            DEPLOY=1
            echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
          else
            echo "::warning::XSERVER_HOST または MAHJONG_XSERVER_TARGET_DIR が未設定のため、Xserverへの転送は行いません"
          fi

          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          # Xserverへは、実行環境（実行ごとに変わる）によっては接続できないことがある。同じ実行の中で
          # やり直しても同じ環境のままなので、ここでは短く切り上げ、失敗したら別の実行環境でやり直す
          RETRIES=3
          retry_cmd() {
            local n=1
            while true; do
              "$@" && return 0
              if [ "$n" -ge "$RETRIES" ]; then return 1; fi
              echo "::warning::失敗（$n/$RETRIES回目）。$((n * 60))秒後にもう一度試します: $1"
              sleep $((n * 60))
              n=$((n + 1))
            done
          }
          DEPLOY_FAILED=0

          # サイトのディレクトリで PHP を実行する。$PHP は新しい版を優先して選ぶ
          # （Xserver の php コマンドは古い版を指すことがあるため）
          xs_php() {
            ssh -i /tmp/deploy_key -p "$XSERVER_PORT" $SSH_OPTS "$XSERVER_USER@$XSERVER_HOST" \
              "cd ${XSERVER_TARGET_DIR} && PHP=\$(command -v php8.3 || command -v php8.2 || command -v php8.1 || command -v php) && $1"
          }

          deploy() {
            local tag="$1"
            if [ "$DEPLOY" != "1" ]; then return 0; fi
            echo "--- Xserverへ反映中（$tag）---"
            if ! retry_cmd ssh -i /tmp/deploy_key -p "$XSERVER_PORT" $SSH_OPTS "$XSERVER_USER@$XSERVER_HOST" \
                 "mkdir -p ${XSERVER_TARGET_DIR}data"; then
              echo "::error::Xserverに接続できませんでした（$tag）。サーバーパネルの「国外IPアクセス制限」などを確認してください"
              DEPLOY_FAILED=1
              return 0   # 失敗の扱いは finish() に任せる（ここで打ち切ると、失敗の目印が付かず自動のやり直しが動かない）
            fi
            # サイト本体（config.php はサーバー上で作成したものを上書きしない）
            # index.html の app.js・style.css の参照にコミットIDを付け、ブラウザが古いファイルを使い続けないようにする
            mkdir -p /tmp/site
            sed "s/__BUILD__/${GITHUB_SHA::8}/g" web/index.html > /tmp/site/index.html
            retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" $SSH_OPTS -r \
              /tmp/site/index.html web/app.js web/style.css \
              server/.htaccess server/lib.php server/schema.sql server/config.sample.php server/api server/admin \
              "$XSERVER_USER@$XSERVER_HOST:$XSERVER_TARGET_DIR" \
              || { echo "::error::サイトの転送に失敗しました（$tag）"; DEPLOY_FAILED=1; }
            # 牌譜（data/kifu）はリポジトリに入れていないため、この実行で作った分だけが転送される（サーバー上の過去分は残る）
            mkdir -p data/kifu data/players data/awards
            retry_cmd scp -i /tmp/deploy_key -P "$XSERVER_PORT" $SSH_OPTS -r \
              data/index.json data/players.json data/players data/awards data/standings data/matches data/titles data/kifu data/newcomer_league \
              "$XSERVER_USER@$XSERVER_HOST:${XSERVER_TARGET_DIR}data/" \
              || { echo "::error::データの転送に失敗しました（$tag）"; DEPLOY_FAILED=1; }
            # DB取り込みは SSH 経由でサーバー上の php を直接実行する
            # （Xserver は海外からの Web アクセスを弾くため、Actions から URL を呼ぶ方式は使えない）
            echo "--- DB取り込み ---"
            retry_cmd xs_php "\$PHP admin/migrate.php && \$PHP admin/import.php" \
              || { echo "::error::データベースへの取り込みに失敗しました（$tag）"; DEPLOY_FAILED=1; }
            return 0
          }
          # 反映に失敗した実行は、最後に「失敗」として終わらせる（次の実行でデータは再送されるが、
          # 牌譜はこの実行で作った分だけなので、失敗時はアーティファクトに退避する）
          finish() {
            rm -f /tmp/deploy_key
            if [ "$DEPLOY_FAILED" = "1" ]; then
              echo "::error::Xserverへの反映に失敗しました。牌譜はこの実行のアーティファクト（kifu-backup）に保存しています"
              echo "DEPLOY_FAILED=1" >> "$GITHUB_ENV"
              exit 1
            fi
          }

          if [ "${{ github.event.inputs.deploy_only }}" = "true" ]; then
            deploy "転送のみ"
            finish
            exit 0
          fi

          TOTAL="${{ github.event.inputs.seasons || '1' }}"
          SCALE="${{ github.event.inputs.sections_scale || '1.0' }}"

          for i in $(seq 1 "$TOTAL"); do
            echo "=== Season batch $i / $TOTAL ==="

            python -u run_season.py --data-dir data --seasons 1 --sections-scale "$SCALE"

            # --- 本戦が終わって次季の欠員が確定したら、投稿を取得して新人リーグを開催（サイト未設置なら0件） ---
            # 勝者は次の実行の本戦の冒頭でDリーグに入門する（結果は今のうちにリーグ表に出る）
            echo '[]' > data/newcomer_submissions.json
            if [ "$DEPLOY" = "1" ]; then
              # 取得・解析のどちらかに失敗したら0件として続行する（サイト未設置・DB未設定の場合など）
              fetch_pending() {
                xs_php "\$PHP admin/export_pending.php" > /tmp/pending.json \
                  && jq -e '.characters // []' /tmp/pending.json > /tmp/submissions.json
              }
              if retry_cmd fetch_pending; then
                mv /tmp/submissions.json data/newcomer_submissions.json
              else
                echo "::warning::投稿の取得に失敗しました。0件として扱います"
                head -c 300 /tmp/pending.json 2>/dev/null || true
              fi
            fi
            python -u run_newcomer_league.py --data-dir data --submissions-path data/newcomer_submissions.json

            git add data
            if ! git diff --staged --quiet; then
              git commit -m "Season batch $i/$TOTAL [skip ci]"
              git pull --rebase origin "${{ github.ref_name }}"
              git push origin "HEAD:${{ github.ref_name }}"
            fi

            deploy "$i"
          done

          finish

      - name: Save kifu on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kifu-backup
          path: data/kifu
          retention-days: 14
          if-no-files-found: ignore

      # 転送の失敗は、別の実行環境ならつながることが多い。牌譜のバックアップを添えて、転送だけをやり直す実行を起こす（最大3回）
      - name: Retry the deploy from a fresh runner
        if: ${{ failure() && env.DEPLOY_FAILED == '1' && fromJSON(github.event.inputs.deploy_attempt || '0') < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run season.yml --ref "${{ github.ref_name }}" \
            -f deploy_only=true \
            -f restore_kifu_run_id="${{ github.run_id }}" \
            -f deploy_attempt="$(( ${{ github.event.inputs.deploy_attempt || 0 }} + 1 ))"
