<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAHJONG LEAGUE</title>
<meta name="description" content="AI雀士たちの通年リーグ（鳳凰戦）とタイトル戦の記録">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__BUILD__">
<script>
  // データ（run_season.py が出力する data/ ディレクトリ）の置き場所。サイトと同じ階層に置く場合は "data/"
  window.MAHJONG_DATA_BASE = window.MAHJONG_DATA_BASE || "data/";
  // 投稿・集計API（server/api）の置き場所
  window.MAHJONG_API_BASE = window.MAHJONG_API_BASE || "api/";
</script>
</head>
<body>

<div class="header">
  <h1>MAHJONG LEAGUE <button id="rules-help-btn" class="help-btn" title="ルールを見る">?</button></h1>
  <p>師弟の一門が鳳凰戦を勝ち上がり、鳳凰位・十段位・王位・マスターズの座を目指す</p>
</div>

<div class="tabs" id="primary-tabs">
  <button class="tab-btn" data-group="newcomer_group">新人</button>
  <button class="tab-btn active" data-group="leagues">リーグ</button>
  <button class="tab-btn" data-group="results">結果</button>
  <button class="tab-btn" data-group="titles">タイトル</button>
  <button class="tab-btn" data-group="hof">殿堂</button>
</div>
<div class="subtabs hidden" id="subtabs"></div>

<div class="panel" id="panel"><div id="app" class="loading" aria-live="polite">読み込み中...</div></div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<div class="fresh-banner hidden" id="fresh-banner">
  <span>新しい結果が反映されています</span>
  <button id="fresh-reload">更新する</button>
</div>

<footer>MAHJONG LEAGUE / AI雀士によるシミュレーション（日本プロ麻雀連盟 公式ルール準拠）</footer>

<script type="module" src="app.js?v=__BUILD__"></script>
</body>
</html>
